    funder: National Science Foundation
    office: America's Seed Fund (TIP Directorate)
    jurisdiction: federal
    vehicle: grant
    stage: entry
    entity: small-business
    domains: [life-science-tools, diagnostics, materials, energy-climate, hardware]
    award: {max: 305000, duration_months: [6, 18], source: nsf-26-510}
    award_data: {agency: NSF, phase: I}
    award_recent: {dataset: nsf-awards, group: SBIR Phase I}
    success:
      rate: 0.11
      year: FY2022
      basis: SBIR Phase I proposals selected (STTR Phase I 25%). NSF states historical Phase I funding rates of 10-20%
      source: sba-fy22
      also: nsf-review
    timing: {notify_days: [150, 210], basis: "Notification 5-7 months after the deadline", source: nsf-review}
    prerequisites: Project Pitch invitation first (response in about 1-2 months; valid for the next two deadlines). Two pitches per company per 12 months
    deadlines: {cadence: Three per year, next: [2027-03-04, 2027-07-07], source: nsf-26-510}
    status: open
    feeds: [nsf-sbir-2, massventures-start, masscec-amplifymass]
    sources: [nsf-26-510, nsf-review, nsf-pitch, sba-fy22, sbir-awards]

