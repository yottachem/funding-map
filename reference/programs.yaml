# Non-Dilutive Funding Map: program registry (hand-curated; every figure carries a source key from `sources:` below).
#
# The program is the unit. Open solicitations hang off a program (reference/opportunities.csv, Phase 2).
# Award history for SBIR/STTR programs is computed, not typed: `award_data` links a row of reference/awards/sbir_stats.csv
# (SBIR.gov bulk award data, award years 2022-2024); `award_recent` links a group in reference/awards/recent.csv (NIH
# RePORTER, NSF Awards API, USAspending; recent fiscal years). Hand-typed figures here are the current rules (caps,
# durations, deadlines) and published success rates.
#
# Field guide
#   jurisdiction  federal | massachusetts
#   vehicle       grant | contract | cooperative-agreement | other-transaction | grant-or-contract
#                 | milestone-award (fixed price, paid per negotiated milestone)
#                 | via-intermediary (a nonfederal partner makes the award from federal funds)
#   stage         entry (first non-dilutive money) | follow-on (needs a prior award) | scale | training | cost-share
#   entity        small-business | academic | either
#   domains       life-science-tools | diagnostics | materials | energy-climate | hardware   (CDR is not a domain: 2026-11-20)
#   trl           [low, high] when the funder states it; omitted otherwise
#   award.max     current per-award ceiling in USD from the funder; null + verify when not confirmed
#   award.not_stated  true only after the funder's own solicitation document was read and states no size (source =
#                 that document, tier 1). Otherwise a size comes from a cap or from actual awards (award_data/recent)
#   success       rate (0-1) with year and basis; `published: false` when the funder publishes none (never estimated)
#   timing        days from submission to award when the funder states it; SBIR programs also get computed timing
#   status        open | between-rounds | upcoming | paused | closed | unknown, as of `verified`
#   verify        fields still to confirm on a primary source before launch
#   feeds         program ids this one leads into (stacking)

verified_default: 2026-11-20

