discovery:
  keywords: ["SBIR", "STTR", "small business innovation", "commercialization", "technology transfer", "prototype",
             "scale-up", "startup", "entrepreneur", "instrumentation", "diagnostic", "advanced manufacturing",
             "advanced materials", "Build to Scale"]
  # Title must contain one of these (case-insensitive) to be queued. Company-facing terms only: "translational",
  # "diagnostic", "instrument" and "accelerator" pulled in academic mechanisms (CTSA, NRSA, S10) on the first run.
  title_terms: ["sbir", "sttr", "small business", "commerciali", "startup", "start-up", "entrepreneur",
                "build to scale", "scale-up", "scale up", "pre-pilot", "prototype"]
  # ...and none of these (academic training, institutional and center mechanisms).
  exclude_terms: ["nrsa", "kirschstein", "career development", "research education", "training", "fellowship",
                  "institutional", "limited competition", "(s10", "(p50", "(u54", "(um1", "(t32", "(r25"]
  # Opportunity numbers never queued (decided not to track; add the reason).
  ignore: {}
